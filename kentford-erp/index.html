<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KENTFORD ERP</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/favicon-192.png">
<link rel="stylesheet" href="css/app.css?v=2">
<!-- Leaflet (peta interaktif Aftersales Partner Coverage Map). CSS di head (ringan, tidak blocking render
     berarti); script pakai `defer` supaya download tidak memblokir parsing HTML bila CDN lambat/blocked —
     window.L baru benar-benar dipakai saat halaman partners_map dibuka (lihat js/partners.js). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<!-- Three.js (scene 3D "Energy Core" interaktif di panel visual halaman login) — defer,
     Login.mountScene3d() cek `typeof THREE` ada sebelum dipakai supaya aman kalau CDN lambat. -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js" defer></script>
<!-- Liquid Glass (badge dekoratif WebGL di panel foto halaman login) — dari dashersw/liquid-glass-js,
     MIT license (lihat js/vendor/liquid-glass/LICENSE). html2canvas dibutuhkan container.js untuk
     sampling background; keduanya defer, dan Login.show() cek window.Container ada sebelum dipakai
     supaya tetap aman kalau CDN lambat/blocked. -->
<link rel="stylesheet" href="css/glass.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<script src="js/vendor/liquid-glass/container.js" defer></script>
</head>
<body>
<div id="root">
 <div class="boot">
  <img class="boot-logo" src="img/logo-kentford.png" alt="Kentford">
  <div class="boot-spinner"></div>
 </div>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<div id="print"></div>
<script src="js/core.js?v=3"></script>
<script src="js/schema.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
<script src="js/sales.js?v=3"></script>
<script src="js/purchasing.js?v=3"></script>
<script src="js/finance.js?v=3"></script>
<script src="js/rental.js?v=3"></script>
<script src="js/service.js?v=3"></script>
<script src="js/partners.js?v=3"></script>
<script src="js/neworder.js?v=3"></script>
<script src="js/dashboard.js?v=3"></script>
<script src="js/reports.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
