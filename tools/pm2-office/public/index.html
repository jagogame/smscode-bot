<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantor VPS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: kantor 3D di kiri, daftar proses + detail di kanan (stack di HP) */
:root{--bg:#101318;--panel:#171b22;--fg:#e9edf3;--muted:#8d97a6;--line:#262c36;--ok:#38d27a;--bad:#ff5d5d;--accent:#7aa7ff;
 --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:16px}
.wrap{max-width:1300px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:end;justify-content:space-between}
h1{font:800 clamp(22px,3.5vw,32px) var(--display);margin:0}
.sum{display:flex;gap:14px;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.sum b{color:var(--fg)}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.stage{position:relative;aspect-ratio:16/11;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d1015}
#c{width:100%;height:100%;display:block;touch-action:none}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font:600 11px var(--mono);white-space:nowrap;padding:2px 7px;border-radius:999px;background:rgba(12,15,20,.82);border:1px solid var(--line)}
.tag.off{border-color:var(--bad);color:#ffc9c9}
.tag.sel{background:var(--accent);color:#0d1015;border-color:var(--accent)}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
h2{font:700 17px var(--display);margin:0 0 10px}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:transparent;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover,.row[aria-current="true"]{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:500 12px var(--mono);color:var(--muted)}
.kv b{display:block;color:var(--fg);font-size:15px}
pre{background:#0b0e12;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin:6px 0 0}
.err{color:#ffb4b4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.val{font:800 20px var(--display);font-variant-numeric:tabular-nums}.lbl{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button.act{font:600 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer}
button.act:hover{border-color:var(--accent)}button.act:disabled{opacity:.45;cursor:default}
pre{margin:0;font:500 12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;background:#0c0f14;border:1px solid var(--line);border-radius:10px;padding:10px;color:#c7d0dc}
.note{font:500 12px var(--mono);color:var(--muted);margin:8px 0 0}
.note.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Kantor VPS</h1><div class="sum" id="sum">memuat…</div></div>
    <div class="sum"><span>auto-refresh <b>5 dtk</b></span></div>
  </header>
  <div class="main">
    <div class="stage"><canvas id="c"></canvas><div class="tags" id="tags"></div></div>
    <div style="display:grid;gap:14px;min-width:0">
      <section><h2>Proses</h2><div class="list" id="list"></div></section>
      <section id="detail" hidden>
        <h2 id="dname">—</h2>
        <div class="kv">
          <div><div class="lbl">Status</div><div class="val" id="dstatus">—</div></div>
          <div><div class="lbl">CPU</div><div class="val" id="dcpu">—</div></div>
          <div><div class="lbl">RAM</div><div class="val" id="dmem">—</div></div>
          <div><div class="lbl">Uptime</div><div class="val" id="dup">—</div></div>
        </div>
        <div class="bar">
          <button class="act" id="brestart">Restart</button>
          <button class="act" id="blogs">Muat log</button>
        </div>
        <pre id="logs">Pilih "Muat log" untuk melihat log terakhir.</pre>
        <p class="note" id="dnote"></p>
      </section>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s);
let procs=[], sel=null, token=localStorage.getItem('officeToken')||'';
const COL={online:0x38d27a,stopping:0xffb020,launching:0xffb020,errored:0xff5d5d,stopped:0x5a6472,unknown:0x5a6472};
const col=s=>COL[s]??COL.unknown;
const fmtUp=s=>{if(!s)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}h ${h}j`:h?`${h}j ${m}m`:`${m}m`;};

// ---- 3D kantor ----
const canvas=$('#c'),stage=canvas.parentElement,tagsEl=$('#tags'),tags={};
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-6,6,4.5,-4.5,.1,100);cam.position.set(8,9,8);cam.lookAt(0,0,0);
const ctr=new THREE.OrbitControls(cam,canvas);ctr.enableDamping=true;ctr.enablePan=false;ctr.maxPolarAngle=Math.PI/2.3;ctr.minZoom=.6;ctr.maxZoom=2.4;
scene.add(new THREE.HemisphereLight(0xffffff,0x4455aa,.9));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(5,10,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9});scene.add(sun);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o||{}));
const box=(w,h,d,c,x,y,z,o)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m;};
box(13,.2,9,0x2a3340,0,-.1,0);
const people={};
function seat(i,n){const cols=4,gx=3.0,gz=2.8;const x=(i%cols-(cols-1)/2)*gx,z=(Math.floor(i/cols)-0.5)*gz;
  box(1.2,.06,.7,0x3a4452,x,.55,z-.15);box(.06,.55,.06,0x222933,x-.5,.27,z-.15);box(.06,.55,.06,0x222933,x+.5,.27,z-.15);
  const scr=box(.55,.36,.04,0x12161c,x,.8,z-.42,{emissive:new THREE.Color(0x38d27a),emissiveIntensity:.1});
  const g=new THREE.Group();g.position.set(x,0,z+.35);scene.add(g);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.55,16),M(0x888));body.position.y=.45;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),M(0xf2d0b0));head.position.y=.86;head.castShadow=true;g.add(head);
  const t=document.createElement('div');t.className='tag';t.onclick=()=>select(n);tagsEl.appendChild(t);
  people[n]={g,body,scr,x,z,tag:t};tags[n]=t;}
function layout(){Object.values(people).forEach(p=>{scene.remove(p.g);p.tag.remove();});for(const k in people)delete people[k];
  procs.forEach((p,i)=>seat(i,p.name));}
function resize(){const w=stage.clientWidth,h=stage.clientHeight,k=w/h;cam.left=-4.8*k;cam.right=4.8*k;cam.top=4.8;cam.bottom=-4.8;cam.updateProjectionMatrix();R.setSize(w,h,false);}
new ResizeObserver(resize).observe(stage);resize();
const v=new THREE.Vector3();
(function loop(t){requestAnimationFrame(loop);ctr.update();
  procs.forEach(p=>{const o=people[p.name];if(!o)return;const on=p.status==='online',busy=on&&p.cpu>5;
    o.body.material.color.setHex(col(p.status));o.scr.material.emissiveIntensity=on?.6:.08;o.scr.material.emissive.setHex(col(p.status));
    o.g.position.y=busy?Math.abs(Math.sin(t/140+o.x))*.12:0;
    v.set(o.x,1.3,o.z).project(cam);const el=o.tag;el.style.left=((v.x+1)/2*stage.clientWidth)+'px';el.style.top=((1-v.y)/2*stage.clientHeight)+'px';
    el.className='tag'+(on?'':' off')+(sel===p.name?' sel':'');el.innerHTML=`${p.name} <i>${on?p.cpu+'%':p.status}</i>`;});
  R.render(scene,cam);})(0);

// ---- data ----
async function refresh(){try{const r=await fetch('/api/procs');const d=await r.json();
  const changed=d.procs.length!==procs.length||d.procs.some((p,i)=>procs[i]?.name!==p.name);
  procs=d.procs;if(changed)layout();renderList();if(sel)renderDetail();
  const on=procs.filter(p=>p.status==='online').length;
  $('#sum').innerHTML=`<span><b>${procs.length}</b> proses</span><span><b style="color:var(--ok)">${on}</b> online</span><span><b style="color:var(--bad)">${procs.length-on}</b> mati</span><span>RAM total <b>${procs.reduce((a,p)=>a+p.memMB,0)} MB</b></span>`;
}catch(e){$('#sum').innerHTML='<span style="color:var(--bad)">gagal ambil data: '+e.message+'</span>';}}
function renderList(){const el=$('#list');el.innerHTML='';procs.forEach(p=>{const b=document.createElement('button');b.className='row';b.setAttribute('aria-current',String(sel===p.name));
  b.innerHTML=`<span class="dot" style="background:#${col(p.status).toString(16).padStart(6,'0')}"></span><span class="nm">${p.name}</span><span class="mt">${p.status==='online'?p.cpu+'% · '+p.memMB+'MB':p.status}</span>`;
  b.onclick=()=>select(p.name);el.appendChild(b);});}
function select(n){sel=n;renderList();renderDetail();$('#logs').textContent='Pilih "Muat log" untuk melihat log terakhir.';$('#dnote').textContent='';}
function renderDetail(){const p=procs.find(x=>x.name===sel);if(!p)return;$('#detail').hidden=false;
  $('#dname').textContent=p.name;$('#dstatus').textContent=p.status;$('#dstatus').style.color='#'+col(p.status).toString(16).padStart(6,'0');
  $('#dcpu').textContent=p.cpu+'%';$('#dmem').textContent=p.memMB+' MB';$('#dup').textContent=fmtUp(p.uptimeSec)+' · ↻'+p.restarts;}
$('#blogs').onclick=async()=>{if(!sel)return;$('#logs').textContent='memuat…';try{const d=await(await fetch('/api/logs/'+encodeURIComponent(sel))).json();
  $('#logs').textContent=(d.err?'── stderr ──\n'+d.err+'\n\n':'')+(d.out||'(log kosong)');}catch(e){$('#logs').textContent='gagal: '+e.message;}};
$('#brestart').onclick=async()=>{if(!sel)return;if(!token){token=prompt('Masukkan OFFICE_TOKEN (dari server):')||'';if(token)localStorage.setItem('officeToken',token);}
  if(!token)return;$('#dnote').className='note';$('#dnote').textContent='restart '+sel+'…';
  try{const r=await fetch('/api/restart/'+encodeURIComponent(sel),{method:'POST',headers:{'x-office-token':token}});const d=await r.json();
    if(d.ok){$('#dnote').textContent='✓ '+sel+' direstart.';refresh();}else{$('#dnote').className='note bad';$('#dnote').textContent=d.error||'gagal';if(r.status===401)localStorage.removeItem('officeToken'),token='';}}
  catch(e){$('#dnote').className='note bad';$('#dnote').textContent='gagal: '+e.message;}};
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
