<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Pesanan — Jago Game</title>
<link rel="icon" href="https://d1x91p7vw3vuq8.cloudfront.net/itemku-upload/2021530/w1gigkzhliayhjr5kezsn.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F0E8;--bg2:#EDE8DE;--bg3:#E4DDD1;--white:#FDFCFA;--dark:#1A1714;--text2:#6B6560;--text3:#9C9590;--orange:#D97757;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);--green:#2D7D5A;--red:#C04A3A}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased;min-height:100vh}
nav{background:rgba(26,23,20,.97);position:sticky;top:0;z-index:10}
.nav-inner{max-width:680px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;gap:10px}
.nav-inner a{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo{width:32px;height:32px;border-radius:9px;object-fit:cover}
.nav-name{font-size:15px;font-weight:700;color:#FDFCFA}
.nav-back{margin-left:auto;font-size:13px;color:rgba(255,255,255,.6);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:40px 24px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.sub{font-size:14px;color:var(--text2);margin-bottom:28px;line-height:1.6}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:9px;font-family:inherit;font-size:14px;color:var(--dark);outline:none}
.fld input:focus{border-color:var(--orange);background:var(--white)}
.btn{width:100%;padding:13px;background:var(--dark);color:var(--bg);border:none;border-radius:11px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.err{font-size:13px;color:var(--red);margin-top:10px;text-align:center}
.result{display:none}
.result.on{display:block}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border:none}
.row .l{color:var(--text3);font-size:12px}
.row .v{font-weight:700}
.badge{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px}
.badge.g{background:#EAF3EC;color:var(--green)}
.badge.o{background:rgba(217,119,87,.13);color:var(--orange)}
.badge.r{background:#FCECEA;color:var(--red)}
.cred-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.cred-box{background:var(--dark);color:#EDE8DE;font-family:'SF Mono',monospace;font-size:13px;line-height:1.7;padding:16px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.copy{width:100%;margin-top:10px;padding:11px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90}
.tst{background:var(--dark);color:var(--bg);padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<nav><div class="nav-inner">
  <a href="/"><img class="nav-logo" src="https://d1x91p7vw3vuq8.cloudfront.net/itemku-upload/2021530/w1gigkzhliayhjr5kezsn.jpg" alt="JG"><span class="nav-name">Jago Game</span></a>
  <a href="/" class="nav-back">← Kembali ke toko</a>
</div></nav>

<div class="wrap">
  <h1>Lacak Pesanan</h1>
  <p class="sub">Masukkan ID Pesanan & nomor WhatsApp yang kamu gunakan saat memesan untuk melihat status & detail akun kamu.</p>

  <div class="card" id="form-card">
    <div class="fld"><label>ID Pesanan</label><input id="i-id" placeholder="ORD-xxxxxxxxxxxxx"></div>
    <div class="fld"><label>Nomor WhatsApp</label><input id="i-wa" type="tel" placeholder="08xxxxxxxxxx"></div>
    <button class="btn" id="btn" onclick="track()">Lacak Pesanan</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card result" id="result">
    <div class="row"><span class="l">ID Pesanan</span><span class="v" id="r-id">—</span></div>
    <div class="row"><span class="l">Produk</span><span class="v" id="r-prod" style="text-align:right;max-width:60%">—</span></div>
    <div class="row"><span class="l">Harga</span><span class="v" id="r-price">—</span></div>
    <div class="row"><span class="l">Status</span><span id="r-status">—</span></div>
    <div id="r-cred-wrap" style="display:none">
      <div class="cred-label">📦 Detail Akun Kamu</div>
      <pre class="cred-box" id="r-cred">—</pre>
      <button class="copy" onclick="copyCred()">📋 Salin Detail Akun</button>
    </div>
    <div id="r-pending" style="display:none;margin-top:16px;font-size:13px;color:var(--text2);line-height:1.6;text-align:center">⏳ Pesanan sedang diproses. Detail akun akan dikirim ke WhatsApp kamu.</div>
  </div>
</div>

<div id="toasts"></div>
<script>
function toast(m){const e=document.createElement('div');e.className='tst';e.textContent=m;document.getElementById('toasts').appendChild(e);setTimeout(()=>e.remove(),2500)}
const params=new URLSearchParams(location.search);
if(params.get('id'))document.getElementById('i-id').value=params.get('id');

async function track(){
  const id=document.getElementById('i-id').value.trim();
  const wa=document.getElementById('i-wa').value.trim();
  const err=document.getElementById('err');
  if(!id||!wa){err.textContent='ID Pesanan & nomor WhatsApp wajib diisi';return}
  err.textContent='';
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Mencari...';
  const r=await fetch('/api/store/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,wa})}).then(r=>r.json()).catch(e=>({error:e.message}));
  btn.disabled=false;btn.textContent='Lacak Pesanan';
  if(r.error){err.textContent=r.error;document.getElementById('result').classList.remove('on');return}
  document.getElementById('r-id').textContent=r.id;
  document.getElementById('r-prod').textContent=r.productName;
  document.getElementById('r-price').textContent='Rp '+Number(r.productPrice).toLocaleString('id-ID');
  const st=document.getElementById('r-status');
  const map={DELIVERED:['Selesai & Terkirim','g'],PAID_NO_STOCK:['Lunas — Diproses','o'],PENDING:['Menunggu Pembayaran','o'],PAID:['Lunas','g']};
  const m=map[r.status]||[r.status,'o'];
  st.innerHTML=`<span class="badge ${m[1]}">${m[0]}</span>`;
  const credWrap=document.getElementById('r-cred-wrap'), pending=document.getElementById('r-pending');
  if(r.credential){credWrap.style.display='block';pending.style.display='none';document.getElementById('r-cred').textContent=r.credential}
  else{credWrap.style.display='none';pending.style.display=r.status==='PENDING'?'none':'block'}
  document.getElementById('result').classList.add('on');
}
function copyCred(){navigator.clipboard.writeText(document.getElementById('r-cred').textContent).then(()=>toast('Detail akun disalin!'))}
document.getElementById('i-wa').addEventListener('keydown',e=>{if(e.key==='Enter')track()});
</script>
</body>
</html>
